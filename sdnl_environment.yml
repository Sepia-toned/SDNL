name: roland4090
channels:
  - conda-forge
  - defaults

dependencies:
  # Base runtime kept close to roland_environment.yml.
  - python=3.9.12
  - pip
  - setuptools=61.2.0
  - wheel=0.37.1

  # Non-GPU scientific stack from the original ROLAND environment.
  # These older versions avoid NumPy/Pandas/NetworkX API breaks in this codebase.
  - numpy=1.21.5
  - pandas=1.4.2
  - scipy=1.7.3
  - scikit-learn=1.0.2
  - networkx=2.7.1
  - numba=0.55.1
  - llvmlite=0.38.0
  - matplotlib=3.5.1
  - seaborn=0.11.2
  - dask=2022.5.0
  - distributed=2022.5.0
  - dask-ml=2022.5.27
  - pyyaml=6.0
  - yacs=0.1.6
  - tensorboard=2.9.0
  - tqdm=4.64.0
  - requests=2.27.1
  - typing-extensions=4.12.2

  # GPU stack is installed by pip wheels to support RTX 4090/Ada (sm_89).
  # Keep torch, CUDA tag, and PyG extension wheels matched.
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - -f https://data.pyg.org/whl/torch-2.6.0+cu124.html
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - torchaudio==2.6.0+cu124
      - pyg-lib==0.4.0+pt26cu124
      - torch-scatter==2.1.2+pt26cu124
      - torch-sparse==0.6.18+pt26cu124
      - torch-cluster==1.6.3+pt26cu124
      - torch-spline-conv==1.2.2+pt26cu124
      - torch-geometric==2.6.1
      - deepsnap==0.2.1
      - littleutils==0.2.2
      - ogb==1.3.3
      - outdated==0.2.1
      - protobuf==3.20.3
      - tensorboardX==2.5
      - openpyxl==3.1.5
